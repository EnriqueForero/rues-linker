[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rues-linker"
version = "0.11.0"
description = "Sistema modular de record linkage y deduplicación de registros empresariales colombianos. Combina blocking por NIT y por nombre (LSH/MinHash), scorer híbrido con features extra, clustering por disco para datasets grandes (millones de filas) y suite de reportes/dashboards. Diseñado para fuentes RUES, DIAN y registros multifuente de ProColombia."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Néstor Enrique Forero Herrera", email = "nforero@procolombia.co"},
]

keywords = ["record-linkage", "deduplication", "entity-resolution", "fuzzy-matching", "minhash", "lsh", "blocking", "rues", "nit", "procolombia", "colombia", "empresarial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "scipy>=1.10",
    "scikit-learn>=1.3,<2",
    "networkx>=3.0,<4",
    "datasketch>=1.6,<2.0",
    "rapidfuzz>=3.0,<4",
    "psutil>=5.9",
    "pytz>=2023.3",
    "tqdm>=4.65",
    "openpyxl>=3.1",
    "h5py>=3.9",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.5", "snowflake-snowpark-python>=1.10"]
viz = ["matplotlib>=3.7", "seaborn>=0.12", "plotly>=5.15", "upsetplot>=0.8"]
optimization = ["optuna>=3.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff==0.15.13", "mypy>=1.8", "pandas-stubs", "types-requests", "matplotlib>=3.7", "seaborn>=0.12", "plotly>=5.15", "upsetplot>=0.8", "optuna>=3.3"]
all = ["rues-linker[snowflake,viz,optimization]"]

[project.urls]
Homepage      = "https://github.com/EnriqueForero/rues-linker"
Repository    = "https://github.com/EnriqueForero/rues-linker"
"Bug Tracker" = "https://github.com/EnriqueForero/rues-linker/issues"

[tool.setuptools.packages.find]
where   = ["src"]
include = ["record_linkage*"]
exclude = ["tests*", "notebooks*", "docs*"]

[tool.setuptools.package-data]
"record_linkage" = ["py.typed"]


# ═══════════════════════════════════════════════════════════
# Pytest
# ═══════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short --strict-markers --cov=record_linkage --cov-report=term-missing --cov-report=xml --cov-fail-under=25"
markers = [
    "paridad: test de paridad binaria contra valores congelados",
    "canario: test canario con datos externos (requiere variable de entorno)",
    "smoke: test rapido end-to-end sobre golden_set.parquet",
]


# ═══════════════════════════════════════════════════════════
# Coverage.py
# ═══════════════════════════════════════════════════════════
[tool.coverage.run]
branch = true
source = ["record_linkage"]
omit = [
    "*/tests/*",
    "*/dashboard.py",
    "*/visualizacion*.py",
    "*/visualizacion_interactiva.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
precision    = 1
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
]


# ═══════════════════════════════════════════════════════════
# Ruff (linter + formatter)
# ═══════════════════════════════════════════════════════════
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    "N806",
    "SIM108",
    "UP007",
    "UP045",
    "RUF001",
    "RUF002",
    "RUF003",
    "N817",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"__init__.py" = ["F401"]
"tests/*" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["record_linkage"]

[tool.ruff.format]
quote-style  = "double"
indent-style = "space"
